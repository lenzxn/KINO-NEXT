<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 40" fill="none">
  <defs>
    <linearGradient id="filmgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#7A1515"/>
    </linearGradient>
    <linearGradient id="textgrad-b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE0C4"/>
    </linearGradient>
  </defs>

  <!-- Film strip column (K backbone) -->
  <rect x="2" y="4" width="12" height="32" rx="2" fill="url(#filmgrad)" opacity="0.95"/>
  <!-- Sprocket holes -->
  <rect x="4.5" y="7"  width="7" height="4.5" rx="1" fill="#0D1117"/>
  <rect x="4.5" y="14" width="7" height="4.5" rx="1" fill="#0D1117"/>
  <rect x="4.5" y="21" width="7" height="4.5" rx="1" fill="#0D1117"/>
  <rect x="4.5" y="28" width="7" height="4.5" rx="1" fill="#0D1117"/>

  <!-- K arms (diagonal strokes) -->
  <line x1="14" y1="20" x2="26" y2="7"  stroke="#C9A84C" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="14" y1="20" x2="26" y2="33" stroke="#C9A84C" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Divider dot -->
  <circle cx="33" cy="20" r="1.5" fill="rgba(201,168,76,0.5)"/>

  <!-- INO wordmark -->
  <text x="38" y="28"
    font-family="Inter, system-ui, sans-serif"
    font-size="22"
    font-weight="800"
    fill="url(#textgrad-b)"
    letter-spacing="1.5">INO</text>
</svg>
