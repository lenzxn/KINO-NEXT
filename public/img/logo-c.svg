<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 40" fill="none">
  <defs>
    <linearGradient id="wordgrad-c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C9A84C"/>
      <stop offset="30%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE0C4"/>
    </linearGradient>
    <linearGradient id="apergrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9B1C1C"/>
    </linearGradient>
  </defs>

  <!-- Camera aperture (6-blade iris) -->
  <g transform="translate(20,20)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="17" stroke="url(#apergrad)" stroke-width="1.5" fill="none" opacity="0.9"/>
    <!-- 6 aperture blades -->
    <g opacity="0.85">
      <ellipse cx="0" cy="-7" rx="4" ry="9" fill="url(#apergrad)" transform="rotate(0)"   opacity="0.8"/>
      <ellipse cx="0" cy="-7" rx="4" ry="9" fill="url(#apergrad)" transform="rotate(60)"  opacity="0.8"/>
      <ellipse cx="0" cy="-7" rx="4" ry="9" fill="url(#apergrad)" transform="rotate(120)" opacity="0.8"/>
      <ellipse cx="0" cy="-7" rx="4" ry="9" fill="url(#apergrad)" transform="rotate(180)" opacity="0.8"/>
      <ellipse cx="0" cy="-7" rx="4" ry="9" fill="url(#apergrad)" transform="rotate(240)" opacity="0.8"/>
      <ellipse cx="0" cy="-7" rx="4" ry="9" fill="url(#apergrad)" transform="rotate(300)" opacity="0.8"/>
    </g>
    <!-- Centre hole -->
    <circle cx="0" cy="0" r="4.5" fill="#0D1117" opacity="0.95"/>
    <circle cx="0" cy="0" r="2" fill="url(#apergrad)" opacity="0.7"/>
  </g>

  <!-- Thin vertical separator -->
  <line x1="43" y1="10" x2="43" y2="30" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>

  <!-- KINO wordmark -->
  <text x="50" y="27"
    font-family="Inter, system-ui, sans-serif"
    font-size="20"
    font-weight="800"
    fill="url(#wordgrad-c)"
    letter-spacing="2.5">KINO</text>
</svg>
